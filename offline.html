<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline | ManPharma</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #3f0089 0%, #6d00ff 70%);
      color: #fff;
      padding: 1rem;
    }
    .card {
      width: min(26rem, 100%);
      background: #ffffff;
      color: #1b1b22;
      border-radius: 1rem;
      padding: 1.1rem;
      text-align: center;
      box-shadow: 0 0.6rem 1.4rem rgba(0, 0, 0, 0.22);
    }
    h1 { margin: 0 0 0.4rem; font-size: 1.15rem; }
    p { margin: 0.2rem 0; font-size: 0.9rem; color: #4f4f59; }
    a {
      display: inline-block;
      margin-top: 0.8rem;
      text-decoration: none;
      background: #6700ff;
      color: #fff;
      font-weight: 700;
      padding: 0.55rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are offline</h1>
    <p>ManPharma app shell is cached.</p>
    <p>Reconnect once to refresh latest updates.</p>
    <a href="./index.html">Back to Dashboard</a>
  </div>
</body>
</html>
